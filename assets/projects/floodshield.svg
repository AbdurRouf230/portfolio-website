<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="1" stop-color="#0e3b5c"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity=".15"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <!-- navbar -->
  <rect x="0" y="0" width="1280" height="64" fill="#0a1830"/>
  <path d="M48 20 l16 -6 l16 6 v12 c0 10 -8 16 -16 20 c-8 -4 -16 -10 -16 -20z" fill="#38bdf8"/>
  <text x="92" y="41" fill="#e0f2fe" font-size="20" font-weight="700">Flood Shield</text>
  <g fill="#94a3b8" font-size="15"><text x="760" y="40">Dashboard</text><text x="860" y="40">Flood Map</text><text x="960" y="40">SOS</text><text x="1020" y="40">Logistics</text></g>
  <rect x="1120" y="18" width="120" height="30" rx="15" fill="#ef4444"/>
  <text x="1180" y="38" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">SOS ALERT</text>
  <!-- title -->
  <text x="48" y="128" fill="#f8fafc" font-size="34" font-weight="800">National Flood Overview</text>
  <text x="48" y="160" fill="#93c5fd" font-size="16">Rainfall · River levels · District risk · Rescue coordination</text>
  <!-- stat cards -->
  <g font-weight="700">
    <rect x="48" y="190" width="260" height="110" rx="16" fill="#112a4a" stroke="#1e4976"/>
    <text x="72" y="228" fill="#93c5fd" font-size="14" font-weight="500">Rainfall (24h)</text>
    <text x="72" y="276" fill="#f8fafc" font-size="36">182 mm</text>
    <rect x="328" y="190" width="260" height="110" rx="16" fill="#112a4a" stroke="#1e4976"/>
    <text x="352" y="228" fill="#93c5fd" font-size="14" font-weight="500">Active SOS</text>
    <text x="352" y="276" fill="#fca5a5" font-size="36">27</text>
    <rect x="608" y="190" width="260" height="110" rx="16" fill="#112a4a" stroke="#1e4976"/>
    <text x="632" y="228" fill="#93c5fd" font-size="14" font-weight="500">Shelters open</text>
    <text x="632" y="276" fill="#f8fafc" font-size="36">64</text>
  </g>
  <!-- chart -->
  <rect x="48" y="324" width="820" height="420" rx="16" fill="#112a4a" stroke="#1e4976"/>
  <text x="72" y="362" fill="#e2e8f0" font-size="17" font-weight="700">River level vs danger mark</text>
  <line x1="72" y1="470" x2="844" y2="470" stroke="#f87171" stroke-dasharray="8 8" stroke-width="2"/>
  <text x="844" y="460" fill="#f87171" font-size="13" text-anchor="end">Danger level</text>
  <path d="M72 700 L72 620 C150 600 190 560 260 540 S380 470 450 455 S570 430 640 470 S760 520 844 500 L844 700Z" fill="url(#water)"/>
  <path d="M72 620 C150 600 190 560 260 540 S380 470 450 455 S570 430 640 470 S760 520 844 500" fill="none" stroke="#38bdf8" stroke-width="4"/>
  <g fill="#64748b" font-size="13"><text x="72" y="724">Sylhet</text><text x="230" y="724">Sunamganj</text><text x="400" y="724">Kurigram</text><text x="560" y="724">Gaibandha</text><text x="740" y="724">Sirajganj</text></g>
  <!-- risk list -->
  <rect x="892" y="190" width="340" height="554" rx="16" fill="#112a4a" stroke="#1e4976"/>
  <text x="916" y="228" fill="#e2e8f0" font-size="17" font-weight="700">District risk (XGBoost)</text>
  <g font-size="15">
    <text x="916" y="276" fill="#cbd5e1">Sunamganj</text><rect x="916" y="286" width="290" height="10" rx="5" fill="#1e3a5f"/><rect x="916" y="286" width="262" height="10" rx="5" fill="#ef4444"/>
    <text x="916" y="336" fill="#cbd5e1">Sylhet</text><rect x="916" y="346" width="290" height="10" rx="5" fill="#1e3a5f"/><rect x="916" y="346" width="232" height="10" rx="5" fill="#f97316"/>
    <text x="916" y="396" fill="#cbd5e1">Kurigram</text><rect x="916" y="406" width="290" height="10" rx="5" fill="#1e3a5f"/><rect x="916" y="406" width="200" height="10" rx="5" fill="#f59e0b"/>
    <text x="916" y="456" fill="#cbd5e1">Gaibandha</text><rect x="916" y="466" width="290" height="10" rx="5" fill="#1e3a5f"/><rect x="916" y="466" width="160" height="10" rx="5" fill="#eab308"/>
    <text x="916" y="516" fill="#cbd5e1">Netrokona</text><rect x="916" y="526" width="290" height="10" rx="5" fill="#1e3a5f"/><rect x="916" y="526" width="120" height="10" rx="5" fill="#22c55e"/>
  </g>
  <rect x="916" y="580" width="290" height="140" rx="12" fill="#0b1f3a"/>
  <text x="936" y="612" fill="#7dd3fc" font-size="14" font-weight="700">AI Assistant</text>
  <text x="936" y="642" fill="#cbd5e1" font-size="13">"Which shelters near Sylhet</text>
  <text x="936" y="662" fill="#cbd5e1" font-size="13">still have space?"</text>
  <rect x="936" y="680" width="190" height="24" rx="12" fill="#1d4ed8"/>
  <text x="1031" y="697" fill="#fff" font-size="12" text-anchor="middle">RAG answer from reports</text>
</svg>
